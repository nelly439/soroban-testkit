name: Bug report
description: Something in soroban-testkit does not work as documented.
title: 'bug: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check that this is a bug in soroban-testkit and not a finding in your contract.
        Security problems: do not file them here, see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: soroban-testkit version
      description: Output of `soroban-testkit --version`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v22.11.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, macOS 15, Windows 11 ...
  - type: dropdown
    id: rpc
    attributes:
      label: RPC
      description: Which RPC were you running against?
      options:
        - testnet
        - futurenet
        - mainnet
        - local network (quickstart)
        - bundled fake RPC (npm run demo:rpc)
        - other / self-hosted
        - none (inspect of a local file)
  - type: textarea
    id: command
    attributes:
      label: Command run
      description: The full command line. Remove API keys from RPC URLs.
      render: shell
      placeholder: npx soroban-testkit fuzz ./target/wasm32v1-none/release/my_contract.wasm --contract-id C... --network testnet --seed 12345
    validations:
      required: true
  - type: input
    id: seed
    attributes:
      label: Seed
      description: The seed printed in the report header (needed to reproduce fuzz and costs runs).
      placeholder: '12345'
  - type: textarea
    id: config
    attributes:
      label: Config file
      description: Your soroban-testkit.config.* if you use one (remove secrets).
      render: ts
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, including the exit code (`echo $?`) and any error output.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report or replay file
      description: |
        If relevant, attach or paste the `--json` report and/or the replay file from `.soroban-testkit/replays/`.
        You can drag files into this box.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Contract spec (`soroban-testkit inspect <target> --json`), links, screenshots.
